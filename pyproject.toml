[project]
name = "archai-mcp"
version = "0.3.2"
description = "Structural analysis engine for AI coding agents"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
authors = [
    {name = "Cristian Chacha", email = "cristianchachaleon@gmail.com"}
]
license = "MIT"
keywords = ["ai", "coding-agent", "architecture", "middleware", "mcp", "opencode", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "typer[all]>=0.9",
    "rich>=13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tree-sitter>=0.20.0",
    "networkx>=3.0.0",
    "mcp>=1.23.0",
]

[project.urls]
Homepage = "https://github.com/CristianChachaLeon/arch-ai"
Repository = "https://github.com/CristianChachaLeon/arch-ai"
Documentation = "https://github.com/CristianChachaLeon/arch-ai#readme"
Issues = "https://github.com/CristianChachaLeon/arch-ai/issues"

[project.optional-dependencies]
llm = [
    "litellm>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
archai = "archai.cli.app:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
