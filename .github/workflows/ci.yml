name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests and coverage
        id: test-coverage
        run: |
            set -o pipefail
            pytest --cov=src --cov-report=term --cov-fail-under=80 | tee coverage.txt

      - name: Extract coverage
        id: extract-coverage
        if: always()
        run: |
          COVERAGE=$(grep TOTAL coverage.txt | awk '{print $NF}' | tr -d '%')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
      
      - name: Post coverage comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.extract-coverage.outputs.coverage }}';
            const outcome = '${{ steps.test-coverage.outcome }}';

            const passed = outcome === 'success';

            const body =
              '## 📊 Coverage Report\n\n' +
              `**Coverage: ${coverage}%**\n\n` +
              (passed
                ? '✅ Meets 80% target'
                : '⚠️ Below 80% threshold');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      
