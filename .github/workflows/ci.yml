name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests and coverage
        id: test-coverage
        run: pytest --cov=src --cov-report=term --cov-report=xml --cov-fail-under=80
        continue-on-error: true

      - name: Extract coverage
        id: extract-coverage
        if: always()
        run: |
          COVERAGE=$(python -c "import os, xml.etree.ElementTree as ET; t = ET.parse('coverage.xml').find('.//totals') if os.path.exists('coverage.xml') else None; print(t.get('percent_covered') if t is not None else 0)")
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.extract-coverage.outputs.coverage }}';
            const outcome = '${{ steps.test-coverage.outcome }}';
            const passed = outcome === 'success';
            const body = '## 📊 Coverage Report\n\n**Coverage: ' + coverage + '%**\n\n' + (passed ? '✅ Meets 80% target' : '⚠️ **Below 80% threshold!**');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if coverage below threshold
        run: |
          if [ "${{ steps.test-coverage.outcome }}" != "success" ]; then
            exit 1
          fi